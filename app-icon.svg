<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    CreaBnB app icon — single source of truth.
    Edit this file, then regenerate the raster with:
      rsvg-convert -w 512 -h 512 app/public/app-icon.svg -o app/public/app-icon.png

    Motif: a big flat house silhouette with a golden "AI sparkle" floating
    off-center above its right shoulder (not stacked on the house's own
    axis, so the two shapes read as separate elements). The sparkle keeps a
    dark outline so it stays legible at any size regardless of what's
    behind it.
  -->
  <defs>
    <linearGradient id="bg" x1="72" y1="64" x2="440" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
      <stop offset="0.55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B3B36"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="250" y1="65" x2="450" y2="265" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#042F2E" flood-opacity="0.22"/>
    </filter>
    <filter id="sparkleShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="416" height="416" rx="108" fill="url(#bg)"/>

  <!-- House: big, flat silhouette so it stays the clear anchor shape. -->
  <g filter="url(#shadow)">
    <path
      d="M256 195 L380 300 V384 C380 392.837 372.837 400 364 400 H148 C139.163 400 132 392.837 132 384 V300 Z"
      fill="#FFFBF7"
    />
    <path
      d="M228 400 V350 C228 334.536 240.536 320 256 320 C271.464 320 284 334.536 284 350 V400 Z"
      fill="#115E59"
    />
  </g>

  <!-- Small accent sparkle, top-left, fully on the teal background. -->
  <path
    fill="#FFFDF5"
    fill-opacity="0.8"
    d="M100 82 Q100 110 128 110 Q100 110 100 138 Q100 110 72 110 Q100 110 100 82 Z"
  />

  <!-- Main AI sparkle: golden, offset above the house's right shoulder — not centred on the house. -->
  <g filter="url(#sparkleShadow)">
    <path
      fill="url(#sparkle)"
      stroke="#92400E"
      stroke-width="9"
      stroke-linejoin="round"
      d="M350 65 Q350 165 450 165 Q350 165 350 265 Q350 165 250 165 Q350 165 350 65 Z"
    />
  </g>
</svg>
